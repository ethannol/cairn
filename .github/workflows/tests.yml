name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  non-model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev --extra evals
      # Grader tests generate synthetic fixtures; they never call Claude.
      - run: uv run --locked pytest -q
