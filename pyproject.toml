[project]
name = "cairn"
version = "0.1.0"
description = "A verification-first harness for LLM agents doing data analysis: deterministic sensors the agent cannot edit, a numbers ledger, and a trap-laden eval suite."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ethan Levy", email = "ethannol@gmail.com" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]
evals = ["scipy>=1.14", "scikit-learn>=1.5"]

[project.scripts]
cairn = "cairn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.hatch.build.targets.wheel.force-include]
"template" = "cairn/template"

[tool.hatch.build.targets.sdist]
include = ["src/cairn", "template", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
